<header class="header-row">
  <mat-toolbar class="header-toolbar">
    <span class="header-item">
      <a matButton [routerLink]="['/']">{{ title() }}</a>
    </span>
    <span>
      <app-layout-userwelcome />
    </span>
    <span class="spacer"></span>
    <!--     <div class="header-item">
      <input type="text" placeholder="Joke content" #filter />
      <button type="submit">Search</button>
    </div> -->
    <div class="header-item">
      <app-layout-joke-add />
    </div>
    <div>
      <button matIconButton [matMenuTriggerFor]="userSelect" aria-label="Select user from the list">
        <mat-icon>manage_accounts</mat-icon>
      </button>
      <mat-menu #userSelect="matMenu">
        @for (userSummary of userSummaryList; track userSummary) {
          <button mat-menu-item (click)="onUserChange(userSummary.userId)">
            {{ userSummary.userName }}
          </button>
        }
      </mat-menu>
    </div>
    <div>
      <button matIconButton [matMenuTriggerFor]="themeSelect" aria-label="Change preferred theme">
        <mat-icon>brightness_6 </mat-icon>
      </button>
      <mat-menu #themeSelect="matMenu">
        <button mat-menu-item (click)="onThemeSelect('light dark')">
          <mat-icon>contrast</mat-icon>
          <span>From OS</span>
        </button>
        <button mat-menu-item (click)="onThemeSelect('light')">
          <mat-icon>light_mode</mat-icon>
          <span>Light mode</span>
        </button>
        <button mat-menu-item (click)="onThemeSelect('dark')">
          <mat-icon>dark_mode</mat-icon>
          <span>Dark theme</span>
        </button>
      </mat-menu>
    </div>
  </mat-toolbar>
</header>

<main>
  <section><router-outlet /></section>
</main>
